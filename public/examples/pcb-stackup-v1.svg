    <rect x="218" y="476" width="372" height="76" fill="url(#copper)" stroke="#fafbf5" stroke-width="2"/>
    
    <text x="404" y="526" class="material" text-anchor="middle" fill="#4b301e">Copper foil</text>
    <text x="846" y="526" class="thickness" text-anchor="end">3.409<tspan class="unit" dx="8">mil</tspan></text>
    <path d="M610 552 H846" stroke="#e5e8dd" stroke-width="1.5"/>
