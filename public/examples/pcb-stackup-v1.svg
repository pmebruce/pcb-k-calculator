    <text x="404" y="624" class="material" text-anchor="middle" fill="#264c39">Core</text>
    <text x="846" y="624" class="thickness" text-anchor="end">15<tspan class="unit" dx="8">mil</tspan></text>
    <path d="M610 672 H846" stroke="#e5e8dd" stroke-width="1.5"/>
  </g>
<g data-material="Copper foil" data-minimum-mil="3.409">
    <text x="111" y="707" class="layer" text-anchor="middle">L3</text><text x="111" y="734" class="position" text-anchor="middle">Inner</text><path d="M179 710 H205" stroke="#9da99b" stroke-width="2"/>
    <rect x="218" y="672" width="372" height="76" fill="url(#copper)" stroke="#fafbf5" stroke-width="2"/>
    
    <text x="404" y="722" class="material" text-anchor="middle" fill="#4b301e">Copper foil</text>
    <text x="846" y="722" class="thickness" text-anchor="end">3.409<tspan class="unit" dx="8">mil</tspan></text>
    <path d="M610 748 H846" stroke="#e5e8dd" stroke-width="1.5"/>
  </g>
<g data-material="Prepreg" data-minimum-mil="10">
    
    <rect x="218" y="748" width="372" height="100" fill="url(#prepreg)" stroke="#fafbf5" stroke-width="2"/>
    <rect x="278" y="770" width="252" height="56" rx="10" fill="#fffefa" stroke="#ccd8bf" stroke-width="1.5"/>
    <text x="404" y="810" class="material" text-anchor="middle" fill="#264c39">Prepreg</text>
    <text x="846" y="810" class="thickness" text-anchor="end">10<tspan class="unit" dx="8">mil</tspan></text>
    <path d="M610 848 H846" stroke="#e5e8dd" stroke-width="1.5"/>
  </g>
<g data-material="Copper foil" data-minimum-mil="3.8">
    <text x="111" y="883" class="layer" text-anchor="middle">L4</text><text x="111" y="910" class="position" text-anchor="middle">Outside</text><path d="M179 886 H205" stroke="#9da99b" stroke-width="2"/>
    <rect x="218" y="848" width="372" height="76" fill="url(#copper)" stroke="#fafbf5" stroke-width="2"/>
    
    <text x="404" y="898" class="material" text-anchor="middle" fill="#4b301e">Copper foil</text>
    <text x="846" y="898" class="thickness" text-anchor="end">3.8<tspan class="unit" dx="8">mil</tspan></text>
    <path d="M610 924 H846" stroke="#e5e8dd" stroke-width="1.5"/>
  </g>
<rect x="218" y="300" width="372" height="624" rx="0" fill="none" stroke="#bdc9b2" stroke-width="2"/>
<rect x="56" y="980" width="788" height="178" rx="18" fill="#164c3a"/>
<text x="82" y="1020" fill="#bed1ac" font-size="24" letter-spacing="2">PWB TOTAL THICKNESS</text>
<text x="82" y="1083" fill="#fffef3" font-size="56" font-weight="700">1.57 ± 0.15<tspan font-size="34" font-weight="400" dx="10">mm</tspan></text>
<text x="82" y="1129" fill="#d8e2cb" font-size="30">61.8 ± 5.9 mil</text>
<text x="56" y="1200" fill="#78846f" font-size="24">Minimum layer values · Schematic not to scale</text>
</svg>